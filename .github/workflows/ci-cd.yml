name: CI/CD Smart School

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Exécuter les tests JUnit et Mockito
        working-directory: backend
        run: mvn --batch-mode clean verify

  frontend:
    name: Vérifications frontend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérifier le formatage
        working-directory: frontend
        run: npm run format:check

      - name: Construire le frontend
        working-directory: frontend
        run: npm run build

  livraison-docker:
    name: Publier l'image ${{ matrix.composant }}
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        composant: [backend, frontend]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer le nom de l'image
        id: image
        shell: bash
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.composant }}" >> "$GITHUB_OUTPUT"

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les tags Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.nom }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.composant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
