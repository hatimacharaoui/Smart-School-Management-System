spring.application.name=smart-school-backend
server.port=8080

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_school?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=1000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cache
spring.cache.type=${CACHE_TYPE:simple}

# JWT
app.jwt.secret=${JWT_SECRET:SmartSchoolJwtSecretKeyForDevelopmentOnly2026Secure}
app.jwt.expiration=86400000

# Frontend / CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Justificatifs de paiement
app.upload.justificatifs=${UPLOAD_DIR:uploads/justificatifs}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs